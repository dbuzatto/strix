        </style>
    </defs>
    <rect id="terminalui" class="background" width="100%" height="100%" ry="4.5826941"/>
    <circle cx="24" cy="23" r="7" class="color1"/>
    <circle cx="44" cy="23" r="7" class="color3"/>
    <circle cx="64" cy="23" r="7" class="color2"/>
    <svg id="screen" width="800" height="714" x="23" y="50" viewBox="0 0 800 714" preserveAspectRatio="xMidYMin slice"><rect class="background" height="100%" width="100%" x="0" y="0"/><defs><g id="g1"><text x="0" textLength="16" font-weight="bold" class="color13">&#10095; </text><text x="16" textLength="336" font-weight="bold" class="color15">strix analyze deployment/api -n strix-demo</text></g><g id="g2"><text x="0" textLength="480" class="foreground">strix: analyzing deployment/api with claude-code (sonnet)...</text></g><g id="g3"><text x="0" textLength="16" class="foreground">  </text><text x="16" textLength="768" fill="#d0d0d0">                                                                                                </text></g><g id="g4"><text x="0" textLength="16" class="foreground">  </text><text x="16" textLength="24" fill="#d0d0d0">1. </text><text x="40" textLength="56" font-weight="bold" fill="#d0d0d0">Summary</text><text x="96" textLength="312" fill="#d0d0d0"> &#8212; Rollout stuck: revision 2 pod is in </text><text x="408" textLength="144" fill="#ff5f5f"> ImagePullBackOff </text><text x="552" textLength="232" fill="#d0d0d0">; the old revision 1 pod is  </text></g><g id="g5"><text x="0" textLength="16" class="foreground">  </text><text x="16" textLength="768" fill="#d0d0d0">healthy and serving traffic.                                                                    </text></g><g id="g6"><text x="0" textLength="16" class="foreground">  </text><text x="16" textLength="24" fill="#d0d0d0">2. </text><text x="40" textLength="80" font-weight="bold" fill="#d0d0d0">Root cause</text><text x="120" textLength="224" fill="#d0d0d0"> &#8212; The revision 2 image tag </text><text x="344" textLength="184" fill="#ff5f5f"> nginx:nonexistent-tag </text><text x="528" textLength="256" fill="#d0d0d0"> does not exist on Docker Hub.  </text></g><g id="g7"><text x="0" textLength="16" class="foreground">  </text><text x="16" textLength="64" fill="#d0d0d0">The pod </text><text x="80" textLength="168" fill="#ff5f5f"> api-584764549-xncts </text><text x="248" textLength="256" fill="#d0d0d0"> has failed to pull it 5 times (</text><text x="504" textLength="248" fill="#ff5f5f"> rpc error: code = NotFound ...</text><text x="752" textLength="32" fill="#d0d0d0">    </text></g><g id="g8"><text x="0" textLength="16" class="foreground">  </text><text x="16" textLength="408" fill="#ff5f5f">docker.io/library/nginx:nonexistent-tag: not found </text><text x="424" textLength="128" fill="#d0d0d0">) and is now in </text><text x="552" textLength="144" fill="#ff5f5f"> ImagePullBackOff </text><text x="696" textLength="88" fill="#d0d0d0">. The      </text></g><g id="g9"><text x="0" textLength="16" class="foreground">  </text><text x="16" textLength="104" fill="#d0d0d0">deployment's </text><text x="120" textLength="144" fill="#ff5f5f"> maxUnavailable=0 </text><text x="264" textLength="520" fill="#d0d0d0"> default is keeping the old pod alive, so the service is         </text></g><g id="g10"><text x="0" textLength="16" class="foreground">  </text><text x="16" textLength="768" fill="#d0d0d0">uninterrupted, but the rollout will never complete.                                             </text></g><g id="g11"><text x="0" textLength="16" class="foreground">  </text><text x="16" textLength="24" fill="#d0d0d0">3. </text><text x="40" textLength="24" font-weight="bold" fill="#d0d0d0">Fix</text><text x="64" textLength="720" fill="#d0d0d0"> &#8212; Roll back to revision 1 immediately:                                                   </text></g><g id="g12"><text x="0" textLength="16" class="foreground">  </text><text x="16" textLength="16" fill="#d0d0d0">  </text><text x="32" textLength="504" fill="#c6c6c6">kubectl rollout undo deployment/api -n strix-demo --to-revision</text><text x="536" textLength="8" fill="#ff8787">=</text><text x="544" textLength="8" fill="#5fffaf">1</text><text x="552" textLength="232" fill="#d0d0d0">                             </text></g><g id="g13"><text x="0" textLength="16" class="foreground">  </text><text x="16" textLength="768" fill="#d0d0d0">Then verify the bad ReplicaSet is scaled down and the rollout completes:                        </text></g><g id="g14"><text x="0" textLength="16" class="foreground">  </text><text x="16" textLength="16" fill="#d0d0d0">  </text><text x="32" textLength="408" fill="#c6c6c6">kubectl rollout status deployment/api -n strix-demo</text><text x="440" textLength="344" fill="#d0d0d0">                                           </text></g><g id="g15"><text x="0" textLength="16" class="foreground">  </text><text x="16" textLength="16" fill="#d0d0d0">  </text><text x="32" textLength="240" fill="#c6c6c6">kubectl get pods -n strix-demo</text><text x="272" textLength="512" fill="#d0d0d0">                                                                </text></g><g id="g16"><text x="0" textLength="16" class="foreground">  </text><text x="16" textLength="768" fill="#d0d0d0">Once stable, fix the root cause in your deployment manifest &#8212; either correct the image tag or   </text></g><g id="g17"><text x="0" textLength="16" class="foreground">  </text><text x="16" textLength="768" fill="#d0d0d0">push the image to the registry &#8212; before attempting another rollout:                             </text></g><g id="g18"><text x="0" textLength="16" class="foreground">  </text><text x="16" textLength="16" fill="#d0d0d0">  </text><text x="32" textLength="232" fill="#626262"># Example: pin to a valid tag</text><text x="264" textLength="520" fill="#d0d0d0">                                                                 </text></g><g id="g19"><text x="0" textLength="16" class="foreground">  </text><text x="16" textLength="16" fill="#d0d0d0">  </text><text x="32" textLength="64" fill="#c6c6c6">kubectl </text><text x="96" textLength="24" fill="#ff87d7">set</text><text x="120" textLength="216" fill="#c6c6c6"> image deployment/api nginx</text><text x="336" textLength="8" fill="#ff8787">=</text><text x="344" textLength="192" fill="#c6c6c6">nginx:1.26 -n strix-demo</text><text x="536" textLength="248" fill="#d0d0d0">                               </text></g><g id="g20"><text x="0" textLength="16" class="foreground">  </text><text x="16" textLength="16" fill="#d0d0d0">  </text><text x="32" textLength="256" fill="#626262"># or edit the manifest and apply</text><text x="288" textLength="496" fill="#d0d0d0">                                                              </text></g><g id="g21"><text x="0" textLength="16" class="foreground">  </text><text x="16" textLength="16" fill="#d0d0d0">&#9474; </text><text x="32" textLength="40" font-weight="bold" fill="#d0d0d0">Note:</text><text x="72" textLength="192" fill="#d0d0d0"> The deployment reports </text><text x="264" textLength="168" fill="#ff5f5f"> ready=1 available=1 </text><text x="432" textLength="352" fill="#d0d0d0"> because the old pod is still running &#8212; the </text></g><g id="g22"><text x="0" textLength="16" class="foreground">  </text><text x="16" textLength="768" fill="#d0d0d0">&#9474; service is live, but the rollout is stuck. Do not scale down manually before the undo         </text></g><g id="g23"><text x="0" textLength="16" class="foreground">  </text><text x="16" textLength="768" fill="#d0d0d0">completes                                                                                       </text></g><g id="g24"><text x="0" textLength="16" class="foreground">  </text><text x="16" textLength="768" fill="#d0d0d0">&#9474; or you will briefly lose availability.                                                        </text></g></defs><g id="screen_view"><g><use xlink:href="#g1" y="0"/><use xlink:href="#g2" y="17"/><use xlink:href="#g3" y="51"/><rect x="408" y="68" width="144" height="17" fill="#303030"/><use xlink:href="#g4" y="68"/><use xlink:href="#g5" y="85"/><rect x="344" y="102" width="184" height="17" fill="#303030"/><use xlink:href="#g6" y="102"/><rect x="80" y="119" width="168" height="17" fill="#303030"/><rect x="504" y="119" width="256" height="17" fill="#303030"/><use xlink:href="#g7" y="119"/><rect x="16" y="136" width="408" height="17" fill="#303030"/><rect x="552" y="136" width="144" height="17" fill="#303030"/><use xlink:href="#g8" y="136"/><rect x="120" y="153" width="144" height="17" fill="#303030"/><use xlink:href="#g9" y="153"/><use xlink:href="#g10" y="170"/><use xlink:href="#g11" y="187"/><use xlink:href="#g3" y="204"/><use xlink:href="#g12" y="221"/><use xlink:href="#g3" y="238"/><use xlink:href="#g13" y="255"/><use xlink:href="#g3" y="272"/><use xlink:href="#g14" y="289"/><use xlink:href="#g15" y="306"/><use xlink:href="#g3" y="323"/><use xlink:href="#g16" y="340"/><use xlink:href="#g17" y="357"/><use xlink:href="#g3" y="374"/><use xlink:href="#g18" y="391"/><use xlink:href="#g19" y="408"/><use xlink:href="#g20" y="425"/><use xlink:href="#g3" y="442"/><rect x="264" y="459" width="168" height="17" fill="#303030"/><use xlink:href="#g21" y="459"/><use xlink:href="#g22" y="476"/><use xlink:href="#g23" y="493"/><use xlink:href="#g24" y="510"/></g><g><use xlink:href="#g1" y="748"/><use xlink:href="#g2" y="765"/><use xlink:href="#g3" y="799"/><rect x="408" y="816" width="144" height="17" fill="#303030"/><use xlink:href="#g4" y="816"/><use xlink:href="#g5" y="833"/><rect x="344" y="850" width="184" height="17" fill="#303030"/><use xlink:href="#g6" y="850"/><rect x="80" y="867" width="168" height="17" fill="#303030"/><rect x="504" y="867" width="256" height="17" fill="#303030"/><use xlink:href="#g7" y="867"/><rect x="16" y="884" width="408" height="17" fill="#303030"/><rect x="552" y="884" width="144" height="17" fill="#303030"/><use xlink:href="#g8" y="884"/><rect x="120" y="901" width="144" height="17" fill="#303030"/><use xlink:href="#g9" y="901"/><use xlink:href="#g10" y="918"/><use xlink:href="#g11" y="935"/><use xlink:href="#g3" y="952"/><use xlink:href="#g12" y="969"/><use xlink:href="#g3" y="986"/><use xlink:href="#g13" y="1003"/><use xlink:href="#g3" y="1020"/><use xlink:href="#g14" y="1037"/><use xlink:href="#g15" y="1054"/><use xlink:href="#g3" y="1071"/><use xlink:href="#g16" y="1088"/><use xlink:href="#g17" y="1105"/><use xlink:href="#g3" y="1122"/><use xlink:href="#g18" y="1139"/><use xlink:href="#g19" y="1156"/><use xlink:href="#g20" y="1173"/><use xlink:href="#g3" y="1190"/><rect x="264" y="1207" width="168" height="17" fill="#303030"/><use xlink:href="#g21" y="1207"/><use xlink:href="#g22" y="1224"/><use xlink:href="#g23" y="1241"/><use xlink:href="#g24" y="1258"/></g></g></svg>
