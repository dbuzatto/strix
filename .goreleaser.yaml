# GoReleaser configuration — builds cross-platform binaries and Linux packages
# (.deb/.rpm/.apk), and publishes a GitHub Release with checksums.
# Run a dry run locally with: goreleaser release --snapshot --clean
version: 2

project_name: strix

before:
  hooks:
    - go mod tidy

builds:
  - id: strix
    main: .
    binary: strix
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/dbuzatto/strix/cmd.version={{ .Version }}
      - -X github.com/dbuzatto/strix/cmd.commit={{ .Commit }}
      - -X github.com/dbuzatto/strix/cmd.date={{ .CommitDate }}

archives:
  - id: strix
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md

# Linux system packages: a .deb (Debian/Ubuntu), .rpm (Fedora/RHEL) and .apk
# (Alpine) for each release, so users can `sudo apt install ./strix_*.deb`
# without needing a Go toolchain.
nfpms:
  - id: strix
    package_name: strix
    vendor: Diogo Buzatto
    homepage: "https://github.com/dbuzatto/strix"
    maintainer: Diogo Buzatto <diogobuzattoo@gmail.com>
    description: |-
      Terminal-first AI analyzer for Kubernetes.
      Strix tells you what is broken and how to fix it, using the Claude Code
      already on your machine or the Anthropic API.
    license: MIT
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

release:
  prerelease: auto
  footer: |
    ---
    Install: see the README for `.deb`/`.rpm` packages, `go install`, or direct downloads.
